<!doctype html>
<!--
  Minimal stand-in for a YouTube watch page: just the elements the userscript looks for
  (ytd-watch-flexy, #movie_player, video.html5-main-video, #below, ytd-comments...).
  Served at /watch (the userscript only runs on that path). ?s=URL loads that script.
  Counts video uploads to WebGL and video-frame callbacks in window.__cnt.
-->
<html dark><head><meta charset="utf-8"><title>Mock watch page</title>
<style>
  body { margin: 0; background: #0f0f0f; color: #fff; font: 14px -apple-system, sans-serif; }
  #masthead-container { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 5; }
  ytd-masthead { display: block; height: 56px; }
  ytd-watch-flexy { display: flex; gap: 24px; padding: 80px 24px 0; }
  #primary { flex: 1; } #secondary { width: 360px; }
  #movie_player { position: relative; aspect-ratio: 16 / 9; }
  video { width: 100%; height: 100%; display: block; }
  .ytp-right-controls { position: absolute; right: 0; bottom: 0; }
  ytd-comments { display: block; margin-top: 24px; }
</style></head>
<body>
<ytd-app>
  <div id="masthead-container" class="ytd-app"><ytd-masthead></ytd-masthead></div>
  <div id="content" class="ytd-app">
    <ytd-watch-flexy>
      <div id="primary">
        <div id="movie_player">
          <video class="html5-main-video" src="/media/test-4k60.mp4" muted autoplay playsinline></video>
          <div class="ytp-right-controls"></div>
        </div>
        <div id="below"><h2>Mock video</h2><p style="height: 200px">Description</p><ytd-comments id="comments"></ytd-comments></div>
      </div>
      <div id="secondary"><p>Related videos</p></div>
    </ytd-watch-flexy>
  </div>
</ytd-app>
<script>
"use strict";
const q = new URLSearchParams(location.search);
// Start every run from the userscript's default settings
try { localStorage.removeItem("ambl-settings-v3"); } catch (e) {}

window.__cnt = { up: 0, rvfc: 0 };
for (const C of [WebGLRenderingContext, window.WebGL2RenderingContext].filter(Boolean)) {
  const orig = C.prototype.texImage2D;
  C.prototype.texImage2D = function (...a) { if (a[a.length - 1] instanceof HTMLVideoElement) __cnt.up++; return orig.apply(this, a); };
}
const rvfc = HTMLVideoElement.prototype.requestVideoFrameCallback;
if (rvfc) HTMLVideoElement.prototype.requestVideoFrameCallback = function (cb) { return rvfc.call(this, (...a) => { __cnt.rvfc++; cb(...a); }); };

// Loop manually before the end (Safari can stall at a clip's loop point)
const v = document.querySelector("video");
setInterval(() => { if (v.duration && v.currentTime > v.duration - 3) v.currentTime = 0.5; if (v.paused) v.play(); }, 250);

if (q.get("s")) {
  const sc = document.createElement("script");
  sc.src = q.get("s") + "?" + Date.now();
  document.body.appendChild(sc);
}
</script>
</body></html>
